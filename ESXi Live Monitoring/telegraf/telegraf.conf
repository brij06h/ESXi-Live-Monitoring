  # ============================================================
# EDIT THIS FILE per machine — it's the only thing that changes
# when you reuse this template on a different ESXi host.
# ============================================================

[agent]
  interval = "60s"
  round_interval = true
  flush_interval = "60s"
  omit_hostname = false

# --- Where the metrics go ---
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "my-esxi-dashboard-token"
  organization = "homelab"
  bucket = "esxi"

# --- Where the metrics come from ---
# Point this at your ESXi host's own management IP (not vCenter,
# since you don't have vCenter — ESXi exposes the same SDK endpoint itself).
[[inputs.vsphere]]
  vcenters = ["https://192.168.226.157"]
  username = "root"
  password = "123@home"
  insecure_skip_verify = true

  vm_metric_include = [
    "cpu.usage.average",
    "mem.usage.average",
    "disk.usage.average",
    "net.usage.average",
  ]

  host_metric_include = [
    "cpu.usage.average",
    "mem.usage.average",
    "disk.usage.average",
    "net.usage.average",
    "power.power.average",
  ]

  # Cuts noisy per-VM discovery calls down for a single-host lab
    max_query_metrics = 256
