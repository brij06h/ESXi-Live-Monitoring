apiVersion: 1

datasources:
  - name: InfluxDB-ESXi
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: homelab
      defaultBucket: esxi
      tlsSkipVerify: true
    secureJsonData:
      token: my-esxi-dashboard-token
    isDefault: true
